name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsodium-dev libssl-dev build-essential

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Configure environment
      run: |
        chmod +x ./configure
        ./configure

    - name: Build C Binaries
      run: make all

    - name: Run C Test Suite (Extended & Attacks)
      run: make check

    - name: Run UI / Integration Tests
      run: node bridge/test_integration.js
