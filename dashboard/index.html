<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SECURE CHANNEL — Cryptographic Security Command Center · The Cryptographic Cinematic Lab</title>
  <meta name="description" content="Secure Channel: The Cryptographic Cinematic Lab — Cryptographic Security Command Center. Applied Cryptographic Design project using C, libsodium, and OpenSSL. 'Every Packet Tells a Story. Every Attack Has a Consequence.'">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip btn btn-sm" href="#view">Skip to content</a>
  <div class="app">
    <aside class="side" aria-label="Primary">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
          <rect x="1" y="1" width="38" height="38" rx="11" fill="rgba(0,240,255,0.06)" stroke="rgba(0,240,255,0.3)"/>
          <circle cx="11" cy="20" r="4" fill="none" stroke="#00f0ff" stroke-width="2"/>
          <circle cx="29" cy="20" r="4" fill="none" stroke="#39ff14" stroke-width="2"/>
          <path d="M15 20h10" stroke="#aab3c0" stroke-width="1.4" stroke-dasharray="2 2"/>
          <rect x="17.5" y="16.5" width="5" height="7" rx="1.4" fill="#b8a6ff"/>
        </svg>
        <div>
          <div class="brand-title">SECURE CHANNEL</div>
          <div class="brand-sub">THE CRYPTOGRAPHIC CINEMATIC LAB</div>
        </div>
      </div>
      <nav id="nav" class="nav" aria-label="Sections"></nav>
      <div class="side-sys" id="side-sys" aria-label="System"></div>
    </aside>

    <header class="head">
      <div class="head-ctx">
        <span class="eyebrow" id="head-group">LAB</span>
        <div class="head-title" id="head-title">Overview</div>
      </div>
      <div class="head-session" aria-label="Current session">
        <span class="eyebrow">Current session</span>
        <span id="sys-status" class="chip c-muted" role="status"><span class="g">○</span>CONNECTING</span>
        <ol id="state-track" class="mini-track" aria-label="Protocol state"></ol>
        <span id="sys-detail" class="sys-detail">starting engine…</span>
      </div>
      <div class="head-spacer"></div>
      <div class="view-modes" role="group" aria-label="View mode">
        <button id="mode-presentation" class="btn btn-sm" aria-pressed="false" title="Examiner presentation view">Presentation</button>
        <button id="mode-engineering" class="btn btn-sm btn-ghost" aria-pressed="true" title="Deep engineering telemetry">Engineering</button>
        <button id="mode-examiner" class="btn btn-sm btn-ghost" title="One-screen examiner audit overview">Examiner</button>
      </div>
      <div class="demo-controls" role="group" aria-label="Demo mode">
        <button id="btn-open-cinema" class="btn btn-primary" style="background: linear-gradient(135deg, #00f0ff, #0088cc); color: #020c14; font-weight: 700; border-color: #00f0ff; box-shadow: 0 0 14px rgba(0,240,255,0.4);" title="Launch the 21-Scene Cinematic Cybersecurity Experience">🎬 CINEMATIC LAB</button>
        <button id="demo-start" class="btn btn-ghost" title="Interactive Step Demo">Interactive Demo</button>
        <button id="demo-next" class="btn btn-ghost">Next step</button>
        <button id="demo-reset" class="btn btn-ghost">Reset</button>
      </div>
    </header>

    <div class="main">
      <main id="view" class="view" tabindex="-1"></main>
      <aside class="rail" aria-label="Security event timeline">
        <div class="rail-head">
          <span class="eyebrow">Security events</span>
          <span id="rail-count" class="rail-count">0</span>
        </div>
        <ol id="rail-events" class="rail-events"></ol>
      </aside>
    </div>

    <footer class="foot" id="foot" aria-label="System status"></footer>

    <!-- Live demonstration: 21 execution stages, rendered by js/demo.js from real results. -->
    <section id="demo-panel" class="theater" hidden role="region" aria-label="Live cryptographic demonstration"></section>
    <div id="toasts" class="toasts" aria-live="polite"></div>
  </div>
</body>
</html>
